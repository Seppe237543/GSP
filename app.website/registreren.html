<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registreren - FitTrack</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="loginpagina">
        <img src="img/fittrack-logo.svg" alt="FitTrack logo" class="loginlogo">

        <div class="kaart">
            <h1>Account maken</h1>
            <p class="kleintekst">Maak een gratis account aan.</p>
            <br>
            <form action="onboarding.html" method="post">
                <div class="veld">
                    <label for="naam">Naam <span class="verplicht">*</span></label>
                    <input type="text" id="naam" name="naam" class="invoer" required>
                </div>
                <div class="veld">
                    <label for="email">E-mailadres <span class="verplicht">*</span></label>
                    <input type="email" id="email" name="email" class="invoer" required>
                </div>
                <div class="veld">
                    <label for="wachtwoord">Wachtwoord <span class="verplicht">*</span></label>
                    <input type="password" id="wachtwoord" name="wachtwoord" class="invoer" minlength="8" required>
                    <p class="kleintekst">Minstens 8 tekens.</p>
                </div>
                <div class="veld">
                    <label for="wachtwoord2">Herhaal wachtwoord <span class="verplicht">*</span></label>
                    <input type="password" id="wachtwoord2" name="wachtwoord2" class="invoer" required>
                </div>
                <p class="kleintekst"><span class="verplicht">*</span> = verplicht veld</p>
                <br>
                <button type="submit" class="knop knoprood breed groot">Account maken</button>
            </form>
            <br>
            <p style="text-align: center">Al een account? <a href="login.html">Log in</a></p>
        </div>
    </div>

    <script src="js/script.js"></script>

</body>

</html>
