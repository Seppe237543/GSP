<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inloggen - FitTrack</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="loginpagina">
        <img src="img/fittrack-logo.svg" alt="FitTrack logo" class="loginlogo">

        <div class="kaart">
            <h1>Inloggen</h1>
            <p class="kleintekst">Welkom terug! Log in om verder te trainen.</p>
            <br>
            <p class="meldingfout">E-mailadres of wachtwoord is fout.</p>
            <br>
            <form action="index.html" method="post">
                <div class="veld">
                    <label for="email">E-mailadres <span class="verplicht">*</span></label>
                    <input type="email" id="email" name="email" class="invoer" required>
                </div>
                <div class="veld">
                    <label for="wachtwoord">Wachtwoord <span class="verplicht">*</span></label>
                    <input type="password" id="wachtwoord" name="wachtwoord" class="invoer foutveld" required>
                    <p class="fouttekst">Vul je wachtwoord in.</p>
                </div>
                <div class="uiteen veld">
                    <label class="kleintekst"><input type="checkbox" name="onthouden"> Onthoud mij</label>
                    <a href="wachtwoord-vergeten.html" class="kleintekst">Wachtwoord vergeten?</a>
                </div>
                <button type="submit" class="knop knoprood breed groot">Inloggen</button>
            </form>
            <br>
            <p style="text-align: center">Nog geen account? <a href="registreren.html">Registreer hier</a></p>
        </div>
    </div>

    <script src="js/script.js"></script>

</body>

</html>
