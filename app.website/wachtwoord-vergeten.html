<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wachtwoord vergeten - FitTrack</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="loginpagina">
        <img src="img/fittrack-logo.svg" alt="FitTrack logo" class="loginlogo">

        <div class="kaart">
            <h1>Wachtwoord vergeten?</h1>
            <p class="kleintekst">Vul je e-mailadres in. Je krijgt een link om een nieuw wachtwoord te kiezen.</p>
            <br>
            <form action="login.html" method="post">
                <div class="veld">
                    <label for="email">E-mailadres <span class="verplicht">*</span></label>
                    <input type="email" id="email" name="email" class="invoer" required>
                </div>
                <button type="submit" class="knop knoprood breed groot">Link versturen</button>
            </form>
            <br>
            <p style="text-align: center"><a href="login.html"><i class="fa-solid fa-arrow-left"></i> Terug naar
                    inloggen</a></p>
        </div>
    </div>

    <script src="js/script.js"></script>

</body>

</html>
